 <div class="card"><div class="rings"><div>${ring(kc/t.kcal,'#d4fc3c','#10d98a',N(kc),'/ '+N(t.kcal))}<div class="rl">${U('kcalR')}</div></div><div>${ring(pr/t.pLo,'#5ab8ff','#7c6cff',pr+'g','/ '+t.pLo+'g')}<div class="rl">${U('protR')}</div></div><div>${ring(wk/D.s.days,'#ffb340','#ff5d73',wk,'/ '+D.s.days)}<div class="rl">${U('wkR')}</div></div></div></div>
 <div class="card"><h2>${T('coachSays')}</h2>${coach().map(m=>`<div class="msg ${m[0]}"><div class="dot">${ic(tip(m),17)}</div><div>${m[1]}</div></div>`).join('')}</div>
 <div class="card"><h2>${T('checkin')}</h2>
 <div class="lbl">${T('sleep')}</div><div class="step"><button onclick="CK.sleep=Math.max(3,CK.sleep-.5);buzz(5);renderHome()">−</button><b>${N(CK.sleep,CK.sleep%1?1:0)} <span class="mut">${U('sleepH')}</span></b><button onclick="CK.sleep=Math.min(12,CK.sleep+.5);buzz(5);renderHome()">+</button></div>
 <div class="lbl">${T('energy')}</div>${sc('energy',E5)}<div class="lbl">${T('mood')}</div>${sc('mood',M5)}
 <div class="tog"><span>${T('wdoneQ')}</span><button class="sw ${CK.workout?'on':''}" onclick="CK.workout=!CK.workout;buzz(10);renderHome()" aria-label="toggle"></button></div>
 <button class="btn" onclick="saveCheck()">${D.checks[today()]?T('updC'):T('saveC')}</button></div>
 <div class="mut" style="padding:0 6px 10px">${T('tg')(N(t.kcal),t.pLo,t.pHi)}</div>`;animRings()}
function saveCheck(){D.checks[today()]={sleep:CK.sleep,energy:CK.energy,mood:CK.mood,workout:CK.workout};if(CK.workout)D.wdone[today()]=true;else delete D.wdone[today()];save();buzz([10,40,20]);CK=null;renderAll()}
