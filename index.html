function renderWork(){const plan=PLANS[D.s.days],l=L();if(wDay>=plan.length)wDay=0;const day=plan[wDay];const k=today()+'|'+D.s.days+'|'+wDay;const LG=D.logs[k]||(D.logs[k]={});
 let h=`<div class="card"><h2>${T('plan')(D.s.days)}</h2><div>${plan.map((p,i)=>`<button class="chip" style="${i==wDay?'background:var(--ac);color:#062':''}" onclick="wDay=${i};renderWork()">${esc(p.name[l])}</button>`).join('')}</div></div><div class="card"><h2>${esc(day.name[l])}</h2><div class="mut">${T('warm')}</div>`;
 day.ex.forEach((e,i)=>{const lg=LG[i]||{done:[],kg:''};const last=lastLog(e.n.en);let sug='';
  if(last)sug=last.all&&last.kg?T('sugUp')(NW(last.kg),NW(+last.kg+2.5)):last.kg?T('sugSame')(NW(last.kg)):'';
  h+=`<div class="ex"><b>${esc(e.n[l])}</b><div class="mut">${e.sets} × ${RV(e.reps)} · ${T('rest')} ${e.rest} · ${esc(e.cue[l])}</div><div class="sets">${Array.from({length:e.sets},(_,s)=>`<label><input type="checkbox" style="width:auto" ${lg.done[s]?'checked':''} onchange="setDone('${k}',${i},${s},this.checked)"> ${T('set')} ${s+1}</label>`).join('')}</div>
  <div class="row"><input type="number" step="0.5" placeholder="${T('wused')}" value="${lg.kg}" onchange="setKg('${k}',${i},this.value)"></div>${sug?`<div class="mut" style="margin-top:4px">📈 ${sug}</div>`:''}</div>`});
 h+=`<button class="b" style="width:100%;margin-top:10px" onclick="finishW()">${T('finish')}</button>${D.wdone[today()]?`<div class="mut" style="text-align:center;margin-top:6px">${T('doneT')}</div>`:''}</div>`;$('#t-work').innerHTML=h}
function lastLog(name){const keys=Object.keys(D.logs).filter(k=>k.split('|')[0]<today()).sort().reverse();
 for(const k of keys){const[,d,i]=k.split('|');const day=(PLANS[d]||[])[i];if(!day)continue;const j=day.ex.findIndex(e=>e.n.en===name);const l=D.logs[k][j];if(j>=0&&l&&l.kg)return{kg:l.kg,all:l.done.filter(Boolean).length>=day.ex[j].sets}}return null}
function setDone(k,i,s,v){const LG=D.logs[k]||(D.logs[k]={});const l=LG[i]||(LG[i]={done:[],kg:''});l.done[s]=v;save()}
function setKg(k,i,v){const LG=D.logs[k]||(D.logs[k]={});const l=LG[i]||(LG[i]={done:[],kg:''});l.kg=v;save();renderWork()}
function finishW(){D.wdone[today()]=true;const c=D.checks[today()]||{};c.workout=true;D.checks[today()]=c;save();renderAll()}
// ---- Food
const QUICK=[[{en:'Beef pho (bowl)',vi:'Phở bò (1 tô)'},450,30],[{en:'Com tam with pork chop',vi:'Cơm tấm sườn'},650,30],[{en:'Banh mi thit',vi:'Bánh mì thịt'},450,20],[{en:'Bun cha',vi:'Bún chả'},550,28],[{en:'Fresh spring rolls (2)',vi:'Gỏi cuốn (2 cuốn)'},180,10],[{en:'Chicken breast 100g',vi:'Ức gà 100g'},165,31],[{en:'Egg (1)',vi:'Trứng (1 quả)'},72,6],[{en:'White rice 1 cup',vi:'Cơm trắng 1 chén'},205,4],[{en:'Oats 50g',vi:'Yến mạch 50g'},190,7],[{en:'Greek yogurt 170g',vi:'Sữa chua Hy Lạp 170g'},100,17],[{en:'Banana',vi:'Chuối (1 quả)'},105,1],[{en:'Whey scoop',vi:'Whey (1 muỗng)'},120,24],[{en:'Iced milk coffee',vi:'Cà phê sữa đá'},150,3],[{en:'Tofu 100g',vi:'Đậu hũ 100g'},80,8]];
function renderFood(){const t=targets(),F=D.food[today()]||[];const kc=F.reduce((a,f)=>a+f.k,0),pr=F.reduce((a,f)=>a+f.p,0);const rem=t.kcal-kc;
 $('#t-food').innerHTML=`<div class="card"><div class="grid"><div><div class="mut">${T('calLeft')}</div><div class="stat" style="color:${rem<0?'var(--bad)':'var(--ac)'}">${N(rem)}</div><div class="mut">${N(kc)} / ${N(t.kcal)} ${T('kcal')}</div></div><div><div class="mut">${T('protein')}</div><div class="stat">${N(pr)} g</div><div class="mut">${T('target')} ${t.pLo}-${t.pHi} g</div></div></div>
 <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,kc/t.kcal*100)}%;${rem<0?'background:var(--bad)':''}"></i></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,pr/t.pLo*100)}%;background:var(--ac2)"></i></div></div>
 <div class="card"><h2>${T('addFood')}</h2><input id="fn" placeholder="${T('fname')}"><div class="row" style="margin-top:6px"><input id="fk" type="number" placeholder="${T('kcal')}"><input id="fp" type="number" placeholder="${T('pg')}"><button class="b" onclick="addF()">${T('add')}</button></div>
 <div style="margin-top:8px">${QUICK.map((q,i)=>`<button class="chip" onclick="addQ(${i})">+ ${esc(q[0][L()])} <span class="mut">${q[1]}</span></button>`).join('')}</div></div>
 <div class="card"><h2>${T('todayH')}</h2>${F.length?'<ul style="padding-left:18px">'+F.map((f,i)=>`<li>${esc(f.q!=null?QUICK[f.q][0][L()]:f.n)} · ${N(f.k)} ${T('kcal')} · ${f.p} g <button class="del" onclick="delF(${i})">✕</button></li>`).join('')+'</ul>':`<div class="mut">${T('nothing')}</div>`}</div>`}
function pushF(o){(D.food[today()]=D.food[today()]||[]).push(o);save();renderAll()}
function addF(){const n=$('#fn').value.trim();if(!n)return;pushF({n,k:+$('#fk').value||0,p:+$('#fp').value||0})}
function addQ(i){const q=QUICK[i];pushF({n:q[0].en,q:i,k:q[1],p:q[2]})}function delF(i){D.food[today()].splice(i,1);save();renderAll()}
// ---- Progress
function trend(){const w=[...D.weights].sort((a,b)=>a.d<b.d?-1:1);if(w.length<2)return null;const t0=new Date(w[0].d+'T00:00')/864e5;
 const xs=w.map(p=>new Date(p.d+'T00:00')/864e5-t0),ys=w.map(p=>p.w),n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
 let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});if(!den)return null;const m=num/den;return{m,b:my-m*mx,t0}}
function renderProg(){const w=[...D.weights].sort((a,b)=>a.d<b.d?-1:1),tr=trend();let proj=T('needTwo');
 if(tr){const wk=tr.m*7;if(tr.m<0){const days=(D.s.goal-curW())/tr.m;proj=T('projDown')(N(wk,2),FD(ld(new Date(Date.now()+days*864e5))));if(wk<-1)proj+=`<br><span style="color:var(--warn)">${T('tooFast')}</span>`}else proj=T('projUp')(N(wk,2))}
 $('#t-prog').innerHTML=`<div class="card"><h2>${T('weight')}</h2><div class="grid"><div><div class="mut">${T('current')}</div><div class="stat">${NW(curW())} kg</div></div><div><div class="mut">${T('toGoal')}</div><div class="stat">${N(curW()-D.s.goal,1)} kg</div></div></div><canvas id="ch"></canvas><div class="mut">${proj}</div></div>
 <div class="card"><h2>${T('logW')}</h2><div class="row"><input id="wd" type="date" value="${today()}"><input id="ww" type="number" step="0.1" placeholder="kg"><button class="b" onclick="addW()">${T('saveB')}</button></div>
 <ul style="padding-left:18px">${w.slice().reverse().map(p=>`<li>${FD(p.d)}: ${NW(p.w)} kg <button class="del" onclick="delW('${p.d}')">✕</button></li>`).join('')}</ul></div>`;draw(w,tr)}
function addW(){const d=$('#wd').value,v=parseFloat(String($('#ww').value).replace(',','.'));if(!d||!(v>0))return;D.weights=D.weights.filter(p=>p.d!==d);D.weights.push({d,w:v});save();renderAll()}
function delW(d){D.weights=D.weights.filter(p=>p.d!==d);save();renderAll()}
function draw(w,tr){const c=$('#ch');if(!c)return;const r=window.devicePixelRatio||1,W=c.clientWidth||320,H=220;c.width=W*r;c.height=H*r;const g=c.getContext('2d');g.scale(r,r);
 if(!w.length)return;const t=w.map(p=>new Date(p.d+'T00:00')/864e5);let t1=Math.min(...t),t2=Math.max(...t);if(t2-t1<7)t2=t1+7;
 const vs=w.map(p=>p.w).concat(D.s.goal);const lo=Math.min(...vs)-1,hi=Math.max(...vs)+1,P=30;
 const X=x=>P+(x-t1)/(t2-t1)*(W-P-10),Y=v=>10+(hi-v)/(hi-lo)*(H-40);
 g.font='11px system-ui';g.fillStyle='#8a90a0';g.strokeStyle='#262a33';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g.beginPath();g.moveTo(P,Y(v));g.lineTo(W,Y(v));g.stroke();g.fillText(N(v),2,Y(v)+4)}
 g.setLineDash([5,4]);g.strokeStyle='#f59e0b';g.beginPath();g.moveTo(P,Y(D.s.goal));g.lineTo(W,Y(D.s.goal));g.stroke();g.fillStyle='#f59e0b';g.fillText(T('goalL')+' '+NW(D.s.goal),W-80,Y(D.s.goal)-4);
 if(tr){g.strokeStyle='#60a5fa';g.beginPath();g.moveTo(X(t1),Y(tr.b+tr.m*(t1-tr.t0)));g.lineTo(X(t2),Y(tr.b+tr.m*(t2-tr.t0)));g.stroke()}g.setLineDash([]);
 g.strokeStyle='#4ade80';g.lineWidth=2;g.beginPath();w.forEach((p,i)=>{const x=X(t[i]),y=Y(p.w);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#4ade80';w.forEach((p,i)=>{g.beginPath();g.arc(X(t[i]),Y(p.w),3,0,7);g.fill()});
 g.fillStyle='#8a90a0';g.fillText(FD(w[0].d),P,H-6);if(w.length>1)g.fillText(FD(w[w.length-1].d),W-75,H-6)}
// ---- Home
function streak(){let n=0,d=new Date();if(!D.checks[today()])d.setDate(d.getDate()-1);while(D.checks[ld(d)]){n++;d.setDate(d.getDate()-1)}return n}
function coach(){const C=T('c'),m=[],t=targets(),F=D.food[today()]||[],kc=F.reduce((a,f)=>a+f.k,0),pr=F.reduce((a,f)=>a+f.p,0),c=D.checks[today()];
 let wk=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=ld(d);if(D.wdone[k]||(D.checks[k]&&D.checks[k].workout))wk++}
 if(wk>=D.s.days)m.push(['',C.onTrack(wk)]);else if(wk<D.s.days-2)m.push(['w',C.behind(wk,D.s.days)]);else m.push(['',C.mid(wk,D.s.days)]);
 if(kc>t.kcal+100)m.push(['x',C.over(N(kc-t.kcal))]);else if(kc>0&&pr<t.pLo*0.6&&new Date().getHours()>=17)m.push(['w',C.lowP(pr,t.pLo)]);else if(kc>0)m.push(['',C.left(N(t.kcal-kc))]);
 const tr=trend();if(tr){const w=tr.m*7;if(w<-1)m.push(['w',C.fast]);else if(w<0)m.push(['',C.good(N(-w,2))]);else m.push(['w',C.flat])}
 if(c){if(c.sleep<6)m.push(['w',C.sleep]);if(c.energy<=2)m.push(['w',C.energy]);if(c.mood<=2)m.push(['',C.mood])}else m.push(['',C.checkin]);
 const s=streak();if(s>=3)m.push(['',C.streak(s)]);return m}
function renderHome(){const t=targets(),c=D.checks[today()]||{sleep:7,energy:3,mood:3,workout:!!D.wdone[today()]};
 $('#t-home').innerHTML=`<div class="card"><div class="grid"><div><div class="mut">${T('streak')}</div><div class="stat">🔥 ${streak()}</div></div><div><div class="mut">${T('wg')}</div><div class="stat">${NW(curW())} → ${NW(D.s.goal)}</div></div></div></div>
 <div class="card"><h2>${T('coachSays')}</h2>${coach().map(([c,t])=>`<div class="msg ${c}">${t}</div>`).join('')}</div>
 <div class="card"><h2>${T('checkin')} · ${FD(today())}</h2>
 <label class="mut">${T('sleep')}: <b id="sv">${N(c.sleep,c.sleep%1?1:0)}</b></label><input id="cs" type="range" min="3" max="10" step="0.5" value="${c.sleep}" oninput="sv.textContent=N(this.value,this.value%1?1:0)">
 <label class="mut">${T('energy')}: <b id="ev">${c.energy}</b></label><input id="ce" type="range" min="1" max="5" value="${c.energy}" oninput="ev.textContent=this.value">
 <label class="mut">${T('mood')}: <b id="mv">${c.mood}</b></label><input id="cm" type="range" min="1" max="5" value="${c.mood}" oninput="mv.textContent=this.value">
 <label class="row" style="margin:8px 0"><span>${T('wdoneQ')}</span><input id="cw" type="checkbox" style="width:auto;flex:0" ${c.workout?'checked':''}></label>
 <button class="b" style="width:100%" onclick="saveCheck()">${D.checks[today()]?T('updC'):T('saveC')}</button></div>
 <div class="mut" style="padding:4px">${T('tg')(N(t.kcal),t.pLo,t.pHi)}</div>`}
function saveCheck(){const w=$('#cw').checked;D.checks[today()]={sleep:+$('#cs').value,energy:+$('#ce').value,mood:+$('#cm').value,workout:w};if(w)D.wdone[today()]=true;else delete D.wdone[today()];save();renderAll()}
// ---- Settings / setup
const ACTS=[1.2,1.375,1.55,1.725];
const langSel=id=>`<label class="mut">${T('lang')}</label><select id="${id}" onchange="setLang(this.value)"><option value="vi" ${L()=='vi'?'selected':''}>Tiếng Việt</option><option value="en" ${L()=='en'?'selected':''}>English</option></select>`;
function profileFields(p,s,blank){const f=(id,l,v,ty='number')=>`<div><label class="mut">${l}</label><input id="${p}${id}" type="${ty}" ${ty=='number'?'step="0.1" inputmode="decimal"':''} value="${blank?'':esc(v)}"></div>`;
 return `<label class="mut">${T('name')}</label><input id="${p}n" value="${blank?'':esc(s.name)}"><div class="grid">${f('w',blank?T('cw'):T('sw'),s.weight)}${f('g',T('gw'),s.goal)}${f('h',T('h'),s.height)}${f('a',T('age'),s.age)}
 <div><label class="mut">${T('sex')}</label><select id="${p}s"><option value="m" ${s.sex=='m'?'selected':''}>${T('male')}</option><option value="f" ${s.sex=='f'?'selected':''}>${T('female')}</option></select></div>
 <div><label class="mut">${T('days')}</label><select id="${p}d"><option ${s.days==4?'selected':''}>4</option><option ${s.days==5?'selected':''}>5</option></select></div></div>
 <label class="mut">${T('act')}</label><select id="${p}x">${ACTS.map((v,i)=>`<option value="${v}" ${s.act==v?'selected':''}>${T('acts')[i]}</option>`).join('')}</select>`}
function readProfile(p){const n=id=>parseFloat(String($('#'+p+id).value).replace(',','.'));return{name:$('#'+p+'n').value.trim(),weight:n('w'),goal:n('g'),height:n('h'),age:n('a'),sex:$('#'+p+'s').value,days:+$('#'+p+'d').value,act:n('x')}}
function renderSetup(){$('#setup').innerHTML=`<h2>${T('welcome')}</h2><div class="mut">${T('onlyPhone')}</div>${langSel('ul')}${profileFields('u',D.s,true)}<button class="b" style="width:100%;margin-top:12px" onclick="doSetup()">${T('start')}</button><p class="mut">${T('disc')}</p>`}
function doSetup(){const v=readProfile('u');if(!v.name||!(v.weight>0)||!(v.goal>0)||!(v.height>0)||!(v.age>0)){alert(T('fill'));return}Object.assign(D.s,v);D.weights=[{d:today(),w:v.weight}];save();boot()}
function renderSet(){const t=targets();
 $('#t-set').innerHTML=`<div class="card">${langSel('sl')}</div><div class="card"><h2>${T('profile')}</h2>${profileFields('p',D.s,false)}<button class="b" style="width:100%;margin-top:10px" onclick="saveSet()">${T('saveB')}</button></div>
 <div class="card"><h2>${T('nums')}</h2><div>${T('bmr')}: <b>${N(t.bmr)}</b> ${T('kcal')}</div><div>${T('tdee')}: <b>${N(t.tdee)}</b> ${T('kcal')}</div><div>${T('daily')}: <b>${N(t.kcal)}</b> ${T('kcal')} <span class="mut">${T('never')(N(t.min))}</span></div><div>${T('protein')}: <b>${t.pLo}-${t.pHi} g</b> (1,6-2 g/kg)</div>
 <p class="mut">${T('med')}</p></div><div class="card"><button class="b s" onclick="if(confirm(T('resetQ'))){localStorage.removeItem(K);location.reload()}">${T('reset')}</button></div>`}
function saveSet(){const v=readProfile('p');if(!v.name)v.name=D.s.name;for(const k of['weight','goal','height','age','act'])if(!(v[k]>0))v[k]=D.s[k];Object.assign(D.s,v);save();boot();alert(T('saved'))}
function setLang(l){D.s.lang=l;save();boot()}
let tab='home';
function renderNav(){$('#nav').innerHTML=['home','work','food','prog','set'].map((k,i)=>`<button data-t="${k}" class="${k==tab?'on':''}"><span>${['🏠','🏋️','🍜','📈','⚙️'][i]}</span>${T('tabs')[i]}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('#nav button,.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#t-'+tab).classList.add('on');if(tab==='prog')renderProg();scrollTo(0,0)})}
function renderAll(){$('#sub').textContent=T('sub')(D.s.days,NW(curW()),NW(D.s.goal));renderNav();renderHome();renderWork();renderFood();renderProg();renderSet()}
function boot(){document.documentElement.lang=L();const need=!D.s.name;$('#setup').style.display=need?'block':'none';$('main').style.display=need?'none':'block';$('#nav').style.display=need?'none':'flex';$('#ttl').textContent=T('appTitle')(need?'':D.s.name);
 if(need){$('#sub').textContent='';renderSetup()}else renderAll()}
boot();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
