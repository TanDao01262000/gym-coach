function trend(){const w=[...D.weights].sort((a,b)=>a.d<b.d?-1:1);if(w.length<2)return null;const t0=new Date(w[0].d+'T00:00')/864e5;

 let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});if(!den)return null;const m=num/den;return{m,b:my-m*mx,t0}}

function ring(p,c1,c2,val,sub,sz=96,sw=10){const r=(sz-sw)/2,C=2*Math.PI*r,id='g'+Math.random().toString(36).slice(2,7),off=C*(1-Math.max(0,Math.min(1,p)));
 return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="${sw}" fill="none"/><circle class="arc" cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="url(#${id})" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${RM?off:C}" data-off="${off}"/></svg><div class="v">${val}<small>${sub}</small></div></div>`}
function animRings(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.off)))}
const dayStats=()=>{const t=targets(),F=D.food[today()]||[];return{t,kc:F.reduce((a,f)=>a+f.k,0),pr:F.reduce((a,f)=>a+f.p,0),F}};
const wkCount=()=>{let n=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=ld(d);if(D.wdone[k]||(D.checks[k]&&D.checks[k].workout))n++}return n};
let CK=null;

 const lost=D.weights.length?(Math.max(...[...D.weights].sort((a,b)=>a.d<b.d?-1:1).slice(0,1).map(p=>p.w))-curW()):0;
 const E5=['😫','😕','😐','🙂','🤩'],M5=['😞','😟','😐','😊','😄'],sc=(k,arr)=>`<div class="scale">${arr.map((e,i)=>`<button class="${CK[k]==i+1?'on':''}" onclick="CK.${k}=${i+1};buzz(8);renderHome()" aria-label="${i+1}">${e}</button>`).join('')}</div>`;
 const tip=m=>m[0]==='x'?'x':m[0]==='w'?'warn':'spark';

 <div class="pills"><span class="pill">${ic('flame',14)} ${streak()} ${L()=='vi'?'ngày':'days'}</span><span class="pill">↓ ${N(lost,1)} kg ${U('lost')}</span><span class="pill">🎯 ${N(curW()-D.s.goal,1)} kg</span></div></div>
 <div class="card"><div class="rings"><div>${ring(kc/t.kcal,'#d4fc3c','#10d98a',N(kc),'/ '+N(t.kcal))}<div class="rl">${U('kcalR')}</div></div><div>${ring(pr/t.pLo,'#5ab8ff','#7c6cff',pr+'g','/ '+t.pLo+'g')}<div class="rl">${U('protR')}</div></div><div>${ring(wk/D.s.days,'#ffb340','#ff5d73',wk,'/ '+D.s.days)}<div class="rl">${U('wkR')}</div></div></div></div>
 <div class="card"><h2>${T('coachSays')}</h2>${coach().map(m=>`<div class="msg ${m[0]}"><div class="dot">${ic(tip(m),17)}</div><div>${m[1]}</div></div>`).join('')}</div>
 <div class="card"><h2>${T('checkin')}</h2>
 <div class="lbl">${T('sleep')}</div><div class="step"><button onclick="CK.sleep=Math.max(3,CK.sleep-.5);buzz(5);renderHome()">−</button><b>${N(CK.sleep,CK.sleep%1?1:0)} <span class="mut">${U('sleepH')}</span></b><button onclick="CK.sleep=Math.min(12,CK.sleep+.5);buzz(5);renderHome()">+</button></div>
 <div class="lbl">${T('energy')}</div>${sc('energy',E5)}<div class="lbl">${T('mood')}</div>${sc('mood',M5)}

 <div class="mut" style="padding:0 6px 10px">${T('tg')(N(t.kcal),t.pLo,t.pHi)}</div>`;animRings()}
function saveCheck(){D.checks[today()]={sleep:CK.sleep,energy:CK.energy,mood:CK.mood,workout:CK.workout};if(CK.workout)D.wdone[today()]=true;else delete D.wdone[today()];save();buzz([10,40,20]);CK=null;renderAll()}
