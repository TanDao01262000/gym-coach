<style>

function trend(){const w=[...D.weights].sort((a,b)=>a.d<b.d?-1:1);if(w.length<2)return null;const t0=new Date(w[0].d+'T00:00')/864e5;
 const xs=w.map(p=>new Date(p.d+'T00:00')/864e5-t0),ys=w.map(p=>p.w),n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
 let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});if(!den)return null;const m=num/den;return{m,b:my-m*mx,t0}}

  <div class="bub">${Array.from({length:e.sets},(_,s)=>`<button class="${lg.done[s]?'on':''}" onclick="setDone('${k}',${i},${s})">${lg.done[s]?ic('chk',22,3):s+1}</button>`).join('')}${e.rest!=='—'?`<div class="kg"><input type="number" step="0.5" inputmode="decimal" placeholder="${T('wused')}" value="${lg.kg}" onchange="setKg('${k}',${i},this.value)"></div>`:''}</div>${sug?`<div class="sug">📈 ${sug}</div>`:''}</div>`});
 h+=`<button id="fin" class="btn" onclick="finishW()">${T('finish')}</button>${D.wdone[today()]?`<div class="mut" style="text-align:center;margin-top:10px">${T('doneT')}</div>`:''}`;$('#t-work').innerHTML=h}
function setDone(k,i,s){const LG=D.logs[k]||(D.logs[k]={});const l=LG[i]||(LG[i]={done:[],kg:''});l.done[s]=!l.done[s];save();buzz(l.done[s]?15:5);renderWork()}
function setKg(k,i,v){const LG=D.logs[k]||(D.logs[k]={});const l=LG[i]||(LG[i]={done:[],kg:''});l.kg=String(v).replace(',','.');save();renderWork()}
function finishW(){D.wdone[today()]=true;const c=D.checks[today()]||{};c.workout=true;D.checks[today()]=c;save();buzz([20,60,20,60,40]);CK=null;renderAll();const b=$('#fin');b&&b.classList.add('pulse');confetti()}
function confetti(){if(RM)return;const c=$('#cf'),g=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cols=['#d4fc3c','#10d98a','#5ab8ff','#ffb340','#ff5d73'];
 const P=Array.from({length:120},()=>({x:W/2,y:H*.7,vx:(Math.random()-.5)*12,vy:-Math.random()*14-6,s:Math.random()*6+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;
 (function t(){g.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});if(++f<110)requestAnimationFrame(t);else g.clearRect(0,0,W,H)})()}
function renderFood(){const{t,kc,pr,F}=dayStats(),rem=t.kcal-kc;
 $('#t-food').innerHTML=`<div class="top"><h1>${T('tabs')[2]}</h1><span class="mut">${FD(today())}</span></div>
 <div class="card"><div class="row" style="gap:18px">${ring(kc/t.kcal,rem<0?'#ff5d73':'#d4fc3c',rem<0?'#ff8a5d':'#10d98a',`<span style="font-size:26px">${N(Math.abs(rem))}</span>`,rem<0?(L()=='vi'?'calo lố':'kcal over'):T('calLeft').toLowerCase(),132,13)}
 <div style="flex:1;min-width:0"><div class="lbl" style="margin-top:0">${U('kcalR')}<span class="mut">${N(kc)} / ${N(t.kcal)}</span></div><div class="prog"><i style="width:${Math.min(100,kc/t.kcal*100)}%;${rem<0?'background:#ff5d73':''}"></i></div>
 <div class="lbl">${T('protein')}<span class="mut">${pr} / ${t.pLo}g</span></div><div class="prog"><i style="width:${Math.min(100,pr/t.pLo*100)}%;background:linear-gradient(90deg,#5ab8ff,#7c6cff)"></i></div></div></div></div>
 <div class="card"><h2>${U('moreFood')}</h2><div class="scroll">${QUICK.map((q,i)=>`<button class="chip" onclick="addQ(${i})">+ ${esc(q[0][L()])}<small>${q[1]}</small></button>`).join('')}</div></div>
 <div class="card"><h2>${T('addFood')}</h2><input id="fn" placeholder="${T('fname')}"><div class="row" style="margin-top:8px"><input id="fk" type="number" inputmode="numeric" placeholder="${T('kcal')}"><input id="fp" type="number" inputmode="numeric" placeholder="${T('pg')}"><button class="btn sm" onclick="addF()">${T('add')}</button></div></div>
 <div class="card"><h2>${T('todayH')}</h2>${F.length?F.map((f,i)=>`<div class="fi"><div><b>${esc(f.q!=null&&QUICK[f.q]?QUICK[f.q][0][L()]:f.n)}</b><div class="mut">${N(f.k)} ${T('kcal')} · ${f.p}g ${L()=='vi'?'đạm':'protein'}</div></div><button class="x" onclick="delF(${i})" aria-label="delete">${ic('x',16)}</button></div>`).join(''):`<div class="mut">${T('nothing')}</div>`}</div>`;animRings()}

function renderProg(){const w=[...D.weights].sort((a,b)=>a.d<b.d?-1:1),tr=trend();let proj=T('needTwo');
 if(tr){const wk=tr.m*7;if(tr.m<0){const days=(D.s.goal-curW())/tr.m;proj=T('projDown')(N(wk,2),FD(ld(new Date(Date.now()+days*864e5))));if(wk<-1)proj+=`<br><span style="color:var(--warn)">${T('tooFast')}</span>`}else proj=T('projUp')(N(wk,2))}
 const st=w.length?w[0].w:D.s.weight,pct=Math.max(0,Math.min(1,(st-curW())/((st-D.s.goal)||1)));
 $('#t-prog').innerHTML=`<div class="top"><h1>${T('tabs')[3]}</h1></div>
 <div class="duo" style="margin-bottom:14px"><div class="card"><div class="mut">${T('current')}</div><div class="big">${NW(curW())}<span class="mut" style="font-size:15px"> kg</span></div></div><div class="card"><div class="mut">${T('toGoal')}</div><div class="big">${N(Math.max(0,curW()-D.s.goal),1)}<span class="mut" style="font-size:15px"> kg</span></div></div></div>
 <div class="card"><div class="lbl" style="margin-top:0">${U('start')} ${NW(st)} kg<span class="mut">🎯 ${NW(D.s.goal)} kg</span></div><div class="prog"><i style="width:${pct*100}%"></i></div><canvas id="ch"></canvas><div class="mut" style="margin-top:10px">${proj}</div></div>
 <div class="card"><h2>${T('logW')}</h2><div class="row"><input id="wd" type="date" value="${today()}"><input id="ww" type="number" step="0.1" inputmode="decimal" placeholder="kg" style="max-width:90px"><button class="btn sm" onclick="addW()">${T('saveB')}</button></div>
 <div style="margin-top:8px">${w.slice().reverse().map(p=>`<div class="fi"><div><b>${NW(p.w)} kg</b><div class="mut">${FD(p.d)}</div></div><button class="x" onclick="delW('${p.d}')" aria-label="delete">${ic('x',16)}</button></div>`).join('')}</div></div>`;requestAnimationFrame(()=>draw(w,tr))}
function draw(w,tr){const c=$('#ch');if(!c)return;const r=devicePixelRatio||1,W=c.clientWidth||320,H=210;c.width=W*r;c.height=H*r;const g=c.getContext('2d');g.scale(r,r);
 if(!w.length)return;const t=w.map(p=>new Date(p.d+'T00:00')/864e5);let t1=Math.min(...t),t2=Math.max(...t);if(t2-t1<7)t2=t1+7;
 const vs=w.map(p=>p.w).concat(D.s.goal);const lo=Math.floor(Math.min(...vs)-1),hi=Math.ceil(Math.max(...vs)+1),PL=30,PR=12,PT=12,PB=26;
 const X=x=>PL+(x-t1)/(t2-t1)*(W-PL-PR),Y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
 g.font='600 11px -apple-system,system-ui,sans-serif';g.fillStyle='#6b7080';g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g.beginPath();g.moveTo(PL,Y(v));g.lineTo(W-PR,Y(v));g.stroke();g.fillText(N(v),2,Y(v)+4)}
 g.setLineDash([4,5]);g.strokeStyle='rgba(255,179,64,.8)';g.beginPath();g.moveTo(PL,Y(D.s.goal));g.lineTo(W-PR,Y(D.s.goal));g.stroke();
 if(tr){g.strokeStyle='rgba(90,184,255,.7)';g.beginPath();g.moveTo(X(t1),Y(tr.b+tr.m*(t1-tr.t0)));g.lineTo(X(t2),Y(tr.b+tr.m*(t2-tr.t0)));g.stroke()}g.setLineDash([]);
 g.fillStyle='#ffb340';const gl=T('goalL')+' '+NW(D.s.goal);g.fillText(gl,W-PR-g.measureText(gl).width,Y(D.s.goal)-6);
 const pts=w.map((p,i)=>[X(t[i]),Y(p.w)]);const path=()=>{g.moveTo(...pts[0]);for(let i=1;i<pts.length;i++){const[a,b]=pts[i-1],[c2,d]=pts[i],mx=(a+c2)/2;g.bezierCurveTo(mx,b,mx,d,c2,d)}};
 if(pts.length>1){const gr=g.createLinearGradient(0,PT,0,H-PB);gr.addColorStop(0,'rgba(16,217,138,.35)');gr.addColorStop(1,'rgba(16,217,138,0)');g.beginPath();path();g.lineTo(pts[pts.length-1][0],H-PB);g.lineTo(pts[0][0],H-PB);g.closePath();g.fillStyle=gr;g.fill()}
 const lg=g.createLinearGradient(PL,0,W,0);lg.addColorStop(0,'#d4fc3c');lg.addColorStop(1,'#10d98a');g.strokeStyle=lg;g.lineWidth=3;g.lineCap='round';g.beginPath();path();g.stroke();
 pts.forEach(([x,y],i)=>{g.beginPath();g.arc(x,y,i==pts.length-1?5.5:3.5,0,7);g.fillStyle=i==pts.length-1?'#d4fc3c':'#10d98a';g.fill();if(i==pts.length-1){g.lineWidth=2;g.strokeStyle='#07080b';g.stroke()}});
 g.fillStyle='#6b7080';g.fillText(FD(w[0].d).slice(0,5),PL,H-6);const e=FD(w[w.length-1].d).slice(0,5);if(w.length>1)g.fillText(e,W-PR-g.measureText(e).width,H-6)}
